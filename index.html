<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB Logistics - Chat with Naomi</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
  /* Floating Icon */
  #naomi-float{position:fixed;bottom:20px;right:20px;z-index:9999;cursor:pointer;}
  #naomi-float img{width:45px;height:45px;border-radius:50%;border:2px solid #25D366;box-shadow:0 3px 8px rgba(0,0,0,.2);object-fit:cover;}
  #online-dot{position:absolute;top:0;right:0;width:10px;height:10px;background:#25D366;border-radius:50%;border:2px solid white;}
  /* Chat Box */
  #chat-box{position:fixed;bottom:85px;right:20px;width:350px;max-width:90vw;height:70vh;background:white;border-radius:12px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.2);display:none;flex-direction:column;}
  #chat-header{display:flex;align-items:center;padding:10px 12px;background:#0d2a54;color:white;}
  #chat-header img{width:32px;height:32px;border-radius:50%;border:1.5px solid white;object-fit:cover;margin-right:10px;}
  #messages{flex:1;overflow-y:auto;padding:12px;background:#e5ddd5}
  .msg{margin:8px 0;padding:10px 14px;border-radius:18px;max-width:80%;line-height:1.4;font-size:13px}
  .user{background:#25D366;color:white;margin-left:auto;border-bottom-right-radius:4px}
  .bot{background:white;color:#333;margin-right:auto;border-bottom-left-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
  #input-area{display:flex;padding:8px;border-top:1px solid #eee;background:white}
  #user-input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:25px;outline:none;font-size:13px}
  #send-btn{margin-left:6px;background:#25D366;color:white;border:none;padding:10px 16px;border-radius:25px;cursor:pointer;font-weight:bold}
  .wa-btn{display:block;text-align:center;background:#25D366;color:white;padding:11px;border-radius:8px;margin-top:8px;text-decoration:none;font-weight:bold;font-size:13px}
</style>
</head>
<body>

<!-- Floating Chat Icon = Naomi Circle 45px -->
<div id="naomi-float">
  <img src="naomi.jpg" alt="Naomi">
  <div id="online-dot"></div>
</div>

<!-- Chat Box -->
<div id="chat-box">
  <!-- Header with Naomi 32px -->
  <div id="chat-header">
    <img src="naomi.jpg" alt="Naomi">
    <div>
      <div style="font-weight:bold;font-size:13px;">Naomi - AB Logistics</div>
      <div style="font-size:10px;opacity:.8;">Online • Built by Netcom Media</div>
    </div>
    <div style="margin-left:auto;cursor:pointer;font-size:18px;" id="close-chat">×</div>
  </div>

  <div id="messages">
    <div class="msg bot">Hello! I'm Naomi, your AB Logistics assistant, built by Netcom Media. How can I help you with deliveries or haulage today?</div>
  </div>

  <div id="input-area">
    <input id="user-input" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const CLIENT_CONFIG = {
  whatsappNumber: "2348012345678", // <-- CHANGE TO AB LOGISTICS REAL NUMBER
  vercelApiUrl: "https://YOUR-VERCEL-PROJECT.vercel.app/api/chat" // <-- CHANGE TO YOUR VERCEL URL
};

let chatHistory = "";
const floatBtn = document.getElementById('naomi-float');
const chatBox = document.getElementById('chat-box');
const closeBtn = document.getElementById('close-chat');
const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

floatBtn.onclick = () => { chatBox.style.display = chatBox.style.display === 'flex' ? 'none' : 'flex'; };
closeBtn.onclick = () => { chatBox.style.display = 'none'; };

async function sendMessage(){
  const text = userInput.value.trim();
  if(!text) return;
  messagesDiv.innerHTML += `<div class="msg user">${text}</div>`;
  chatHistory += `Customer: ${text}\n`;
  userInput.value = "";
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const res = await fetch(CLIENT_CONFIG.vercelApiUrl, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message: text, history: chatHistory})
    });
    const data = await res.json();
    let botText = data.reply.replace("[HUMAN_HANDOFF]", "").trim();
    chatHistory += `Naomi: ${botText}\n`;

    let botHtml = `<div class="msg bot">${botText}</div>`;
    if(data.needHuman){
      const waText = encodeURIComponent(`Hello AB Logistics, I was chatting with Naomi on your website.\n\nCHAT HISTORY:\n${chatHistory}\nMy last message: ${text}\n\nPlease assist me.`);
      botHtml = `<div class="msg bot">${botText}
        <div style="background:#e8f5e9;padding:8px 10px;border-radius:6px;margin-top:8px;font-size:12px;color:#2e7d32;border:1px solid #c8e6c9;">
          Chat with Our dispatch Team
        </div>
        <a class="wa-btn" target="_blank" href="https://wa.me/${CLIENT_CONFIG.whatsappNumber}?text=${waText}">Continue on WhatsApp</a>
      </div>`;
    }
    messagesDiv.innerHTML += botHtml;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  } catch(e){
    messagesDiv.innerHTML += `<div class="msg bot">Sorry, network error. Please Chat with Our dispatch Team on WhatsApp.</div>`;
  }
}
sendBtn.onclick = sendMessage;
userInput.addEventListener("keypress", (e)=>{ if(e.key==="Enter") sendMessage(); });
</script>
</body>
</html>
